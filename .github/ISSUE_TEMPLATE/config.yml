# Blank issues stay open on purpose: a question, or a measurement that contradicts
# docs/ANYTYPE-LIMITS.md, does not fit a bug form and is worth more than one.
blank_issues_enabled: true
contact_links:
  - name: Anytype itself
    url: https://community.anytype.io
    about: >-
      A question about Anytype, its local API or its data model belongs to the Anytype
      community rather than here. This repository only covers the `atl` CLI.
  - name: An idea, or something the CLI cannot do yet
    url: https://github.com/Oward-Studio/atl/discussions/categories/ideas
    about: >-
      Ideas live in Discussions rather than here, so the issue list stays a list of things
      that are broken. Describe the workflow you are stuck on rather than the feature you
      have in mind — that is what makes an idea arguable. A discussion becomes an issue
      once it convinces.
