name: CI

# The hermetic suite needs neither Anytype nor an app key: it spawns the real
# binary against a fake HTTP server in disposable XDG directories. `test:live`
# does need both, so it stays out of CI and is run by hand.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Without this, the matrix names the check `test (20.11)`, which reads as a mystery
    # number in the pull-request list. Renaming is safe only because branch protection
    # requires `ci` below and never these names.
    name: test node@${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.11 is the floor declared in package.json engines; proving it still
        # holds is the point of testing two versions rather than one.
        node: ['20.11', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # `main` is squash-merged, so the pull request title becomes the commit message that
  # release-please reads to compute the next version. A title that is not a Conventional
  # Commit therefore skips a release in silence — which is why this is enforced here and
  # not in a local git hook: a hook never sees a title, and an outside contributor never
  # installs one.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: The title must be a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -qE '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([a-z0-9 ._-]+\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "::error::\"$TITLE\" is not a Conventional Commit."
            echo "Expected: <type>: <summary> — feat, fix, docs, test, refactor, chore, ci…"
            echo "feat and fix are what release a new version; the others do not."
            exit 1
          fi

      # A `!` is one keystroke and costs a major version. Requiring the footer turns it
      # into a sentence someone had to write, and the footer is what release-please
      # actually reads — from a commit message, since squashing takes the body from the
      # branch commits rather than from this description.
      # Anchored on the type prefix rather than searching the whole title: a title that
      # merely mentions the syntax — `docs: explain why feat!: needs a footer` — is not a
      # breaking change, and gating it would demand a footer for a break that does not
      # exist.
      - name: A breaking change has to say what breaks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if ! printf '%s' "$TITLE" | grep -qE '^[a-z]+(\([a-z0-9 ._-]+\))?!: '; then
            echo "not a breaking change, nothing to require"
            exit 0
          fi
          # `--paginate`: the default page holds 30 commits, and a footer written in the
          # thirty-first would otherwise be invisible.
          if gh api --paginate "repos/${{ github.repository }}/pulls/${PR}/commits" \
               --jq '.[].commit.message' | grep -qE '^BREAKING CHANGE: .+'; then
            echo "ok: the break is described in a commit message"
          else
            echo "::error::A '!' title needs a 'BREAKING CHANGE: <what breaks>' footer in a commit."
            echo "Without it release-please would bump the major on a keystroke alone."
            exit 1
          fi

  # The single check branch protection requires, and the reason it exists: job names
  # derived from a matrix (`test (20.11)`) change whenever the matrix does, and a
  # required check that stops being reported leaves every pull request waiting for
  # something that will never arrive — pending for ever rather than failing loudly.
  # Adding a job or moving to another Node version now means editing `needs` here,
  # with the protected name untouched.
  #
  # Do not rename this job, and do not give it a `name:`. Its identifier is what branch
  # protection stores; changing it leaves every pull request waiting for a check that is
  # never reported. The jobs above are free to be renamed precisely because this one is
  # not.
  ci:
    # `always()` is load-bearing. Without it this job is *skipped* when `test` fails,
    # and GitHub counts a skipped required check as a passing one.
    if: always()
    needs: [test, pr-title]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must have succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test → ${{ needs.test.result }}"
            exit 1
          fi
          # `pr-title` is skipped on a push to main, where there is no title to check.
          # Spelled out rather than relied upon: GitHub counts a skipped job as passing,
          # and that default is exactly what this gate exists to not depend on.
          case "${{ needs.pr-title.result }}" in
            success|skipped) ;;
            *) echo "pr-title → ${{ needs.pr-title.result }}"; exit 1 ;;
          esac
