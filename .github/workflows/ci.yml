name: CI

# The hermetic suite needs neither Anytype nor an app key: it spawns the real
# binary against a fake HTTP server in disposable XDG directories. `test:live`
# does need both, so it stays out of CI and is run by hand.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Without this, the matrix names the check `test (20.11)`, which reads as a mystery
    # number in the pull-request list. Renaming is safe only because branch protection
    # requires `ci` below and never these names.
    name: test node@${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20.11 is the floor declared in package.json engines; proving it still
        # holds is the point of testing two versions rather than one.
        node: ['20.11', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # The single check branch protection requires, and the reason it exists: job names
  # derived from a matrix (`test (20.11)`) change whenever the matrix does, and a
  # required check that stops being reported leaves every pull request waiting for
  # something that will never arrive — pending for ever rather than failing loudly.
  # Adding a job or moving to another Node version now means editing `needs` here,
  # with the protected name untouched.
  #
  # Do not rename this job, and do not give it a `name:`. Its identifier is what branch
  # protection stores; changing it leaves every pull request waiting for a check that is
  # never reported. The jobs above are free to be renamed precisely because this one is
  # not.
  ci:
    # `always()` is load-bearing. Without it this job is *skipped* when `test` fails,
    # and GitHub counts a skipped required check as a passing one.
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Every required job must have succeeded
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "test → ${{ needs.test.result }}"
            exit 1
          fi
